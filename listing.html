<div class="front">
  <div class="grid">
    <a data-for="row in rows" data-open="row" class="card" data-class-lead="$first" data-class-read="row.read" data-class-pictured="row.picture">
      <span data-if="row.picture" class="picture"><img src="{{ row.picture }}" alt="" loading="lazy"></span>
      <span class="text">
        <span class="headline"><span class="kicker">{{ row.site || row.source }}</span> {{ row.title }}</span>
        <span class="meta">
          <span data-if="row.author" class="byline">{{ row.author }}</span>
          <span data-if="row.ago">{{ row.ago }}</span>
          <span data-if="row.comments" class="comments">{{ row.comments }}</span>
        </span>
      </span>
    </a>
  </div>
</div>
